<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="836" viewBox="0 0 1180 836"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="836" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">First-sync decision: how workspaces get wiped, and how to prevent it</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">On connect, Fabric makes the workspace and the branch folder match. The direction of that first match is the single most destructive decision in the whole integration.</text><rect x="430" y="92" width="320" height="56" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="590.0" y="123.22" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#12314F">Connect workspace to branch + folder</text><line x1="590" y1="148" x2="590" y2="176" stroke="#3A3F4B" stroke-width="2" marker-end="url(#ah)"/><polygon points="590,178.0 755.0,216 590,254.0 425.0,216" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="590" y="211.68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">Is the target branch folder</text><text x="590" y="229.23000000000002" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">empty?</text><path d="M 425,216 L 300,216 L 300,262" fill="none" stroke="#1A4D8F" stroke-width="2" marker-end="url(#ahb)"/><text x="305" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1A4D8F">EMPTY</text><rect x="120" y="266" width="360" height="108" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="133" y="291.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#124A20">Fabric copies workspace → Git</text><text x="133" y="313.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#124A20">The non-empty side wins. Nothing in the workspace</text><text x="133" y="328.58" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#124A20">is deleted. This is the safe and intended direction</text><text x="133" y="343.76" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#124A20">for a first connection.</text><line x1="300" y1="374" x2="300" y2="402" stroke="#1E7B34" stroke-width="2" marker-end="url(#ahg)"/><rect x="120" y="406" width="360" height="92" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="133" y="431.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#124A20">Commit the baseline immediately</text><text x="133" y="453.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#124A20">Open Source control → Changes → select all → Commit.</text><text x="133" y="468.58" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#124A20">Until a baseline exists in the branch, the workspace</text><text x="133" y="483.76" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#124A20">has no recoverable copy in Git.</text><path d="M 755,216 L 890,216 L 890,262" fill="none" stroke="#B3261E" stroke-width="2" marker-end="url(#ahr)"/><text x="768" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#B3261E">NOT EMPTY</text><rect x="700" y="266" width="400" height="128" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="713" y="291.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#7A1A15">Fabric forces you to choose a direction</text><text x="713" y="313.4" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Commit workspace to Git → overwrites Git content</text><text x="713" y="327.91999999999996" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Update workspace from Git → OVERWRITES AND DELETES</text><text x="713" y="342.43999999999994" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">workspace items</text><text x="713" y="363.55999999999995" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">If the branch folder holds only a README, 'Update'</text><text x="713" y="378.0799999999999" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">resolves</text><text x="713" y="392.5999999999999" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">the workspace to almost-empty. Items are removed.</text><line x1="890" y1="404" x2="890" y2="428" stroke="#B3261E" stroke-width="2" marker-end="url(#ahr)"/><rect x="700" y="432" width="400" height="88" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="713" y="456.88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#7A1A15">Stop — do not choose yet</text><text x="713" y="478.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#7A1A15">Disconnect, empty the folder or pick a new folder name,</text><text x="713" y="493.53000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#7A1A15">then reconnect and take the safe left-hand path.</text><text x="713" y="508.71000000000004" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#7A1A15">Never resolve this dialog under time pressure.</text><rect x="120" y="548" width="980" height="118" rx="7" fill="#E4F4F5" stroke="#0E6E78" stroke-width="1.8"/><text x="133" y="573.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#08454B">PREFLIGHT — do this before touching source control settings</text><text x="133" y="595.4000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">1. Clone the workspace to a spare workspace (deployment pipeline stage) as a rollback target.</text><text x="133" y="610.58" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">2. Re-hydrate lakehouse Files/Tables and warehouse objects in the clone — a pipeline clone copies item definitions, not data.</text><text x="133" y="625.76" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">3. Verify the clone actually runs. An unverified backup is not a backup.</text><text x="133" y="640.9399999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">4. Confirm the target Git folder is genuinely empty — no README, no .gitkeep, no placeholder folders.</text><rect x="120" y="690" width="980" height="118" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="610.0" y="717.29" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#7A1A15">The wipe-out pattern, stated plainly</text><text x="610.0" y="742.1899999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#7A1A15">Update from Git resolves the workspace to whatever the branch folder contains. If the branch folder is empty or near-empty, the workspace becomes</text><text x="610.0" y="758.27" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#7A1A15">empty or near-empty. Fabric does not warn you a second time and a workspace — unlike a branch — cannot be restored to an earlier state.</text><text x="610.0" y="774.3499999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#7A1A15"></text><text x="610.0" y="790.43" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#7A1A15">Rule: after the initial connection, use Commit for your own edits and Update only when you know incoming changes exist.</text></svg>