<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="740" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">Rollback decision: revert or reset, then re-sync Fabric</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">The deciding question is never 'which command is cleaner' — it is 'has anyone else pulled this commit'.</text><rect x="430" y="92" width="320" height="52" rx="7" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="590.0" y="121.33500000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#323741">A bad change is in the branch</text><line x1="590" y1="144" x2="590" y2="172" stroke="#3A3F4B" stroke-width="2" marker-end="url(#ah)"/><polygon points="590,174.0 790.0,212 590,250.0 390.0,212" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="590" y="207.68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">Has the commit been pushed to a</text><text x="590" y="225.23000000000002" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">shared branch?</text><path d="M 390,212 L 250,212 L 250,260" fill="none" stroke="#1E7B34" stroke-width="2" marker-end="url(#ahg)"/><text x="256" y="202" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#166A2C">YES — shared</text><path d="M 790,212 L 930,212 L 930,260" fill="none" stroke="#B3261E" stroke-width="2" marker-end="url(#ahr)"/><text x="790" y="202" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#B3261E">NO — local or private</text><rect x="60" y="264" width="500" height="196" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="73" y="290.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#124A20">git revert — the safe method</text><text x="73" y="313.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">Creates a NEW commit that inverts the bad one. History is</text><text x="73" y="328.02" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">preserved, so collaborators are unaffected.</text><text x="73" y="349.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">git checkout main</text><text x="73" y="363.65999999999997" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">git pull origin main</text><text x="73" y="378.17999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">git log --oneline # find the hash</text><text x="73" y="392.69999999999993" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">git revert &lt;hash&gt; # or &lt;old&gt;^..&lt;new&gt; for a range</text><text x="73" y="407.2199999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">git push origin main</text><text x="73" y="428.3399999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">Revert a range newest-first to avoid conflicts.</text><rect x="620" y="264" width="500" height="196" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="633" y="290.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#7A1A15">git reset --hard — destructive</text><text x="633" y="313.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Moves the branch pointer and discards everything after it.</text><text x="633" y="328.02" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Rewrites history. Never use on a shared branch.</text><text x="633" y="349.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">git log --oneline # find the last good hash</text><text x="633" y="363.65999999999997" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">git reset --hard &lt;hash&gt;</text><text x="633" y="378.17999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">git push origin &lt;branch&gt; --force</text><text x="633" y="399.29999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Requires force-push permission, which the main ruleset</text><text x="633" y="413.81999999999994" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">should deny. That denial is intentional.</text><path d="M 310,464 L 310,496 L 590,496 L 590,528" fill="none" stroke="#1E7B34" stroke-width="2" marker-end="url(#ahg)"/><path d="M 870,464 L 870,496 L 590,496" fill="none" stroke="#B3261E" stroke-width="2"/><rect x="230" y="528" width="720" height="134" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="243" y="554.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#12314F">Then restore the Fabric workspace</text><text x="243" y="577.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">1. Open the workspace connected to that branch.</text><text x="243" y="592.68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">2. Source control → Updates. Fabric detects the branch moved and lists what must change.</text><text x="243" y="607.8599999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">3. Update all, and confirm. The workspace is overwritten to match the restored commit.</text><text x="243" y="623.0399999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">4. Verify items run. Git integration restores definitions only — it does not restore lakehouse or warehouse</text><text x="243" y="638.2199999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">data.</text><rect x="230" y="678" width="720" height="52" rx="6" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="590.0" y="698.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6E4200">Fabric also offers Undo in the source control pane for uncommitted workspace changes — use it</text><text x="590.0" y="715.18" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6E4200">before reaching for Git.</text></svg>