<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="780" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">Reference architecture: Microsoft Fabric ALM on GitHub</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Git integration governs development and collaboration; deployment pipelines govern release. Names in &lt;angle brackets&gt; are placeholders.</text><rect x="28" y="84" width="1124" height="200" rx="9" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="42" y="103" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#12314F" letter-spacing="0.6">1 · ISOLATED DEVELOPMENT</text><rect x="58" y="120" width="224" height="62" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="170.0" y="143.505" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#12314F">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-FEAT-01</text><text x="170.0" y="165.255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">branch workspace</text><rect x="58" y="208" width="224" height="46" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="170.0" y="233.64499999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2B2450">feature/&lt;topic&gt;_&lt;YYYY_MM&gt;</text><line x1="170" y1="183" x2="170" y2="206" stroke="#4B3F86" stroke-width="1.6" marker-end="url(#ahp)" marker-start="url(#ahb)"/><rect x="308" y="120" width="224" height="62" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="420.0" y="143.505" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#12314F">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-FEAT-02</text><text x="420.0" y="165.255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">branch workspace</text><rect x="308" y="208" width="224" height="46" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="420.0" y="233.64499999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2B2450">feature/&lt;topic&gt;_&lt;YYYY_MM&gt;</text><line x1="420" y1="183" x2="420" y2="206" stroke="#4B3F86" stroke-width="1.6" marker-end="url(#ahp)" marker-start="url(#ahb)"/><rect x="558" y="120" width="224" height="62" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="670.0" y="143.505" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#12314F">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-FEAT-nn</text><text x="670.0" y="165.255" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">branch workspace</text><rect x="558" y="208" width="224" height="46" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="670.0" y="233.64499999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2B2450">feature/&lt;topic&gt;_&lt;YYYY_MM&gt;</text><line x1="670" y1="183" x2="670" y2="206" stroke="#4B3F86" stroke-width="1.6" marker-end="url(#ahp)" marker-start="url(#ahb)"/><rect x="830" y="120" width="294" height="134" rx="7" fill="#E4F4F5" stroke="#0E6E78" stroke-width="1.8"/><text x="977.0" y="144.88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#08454B">Variable Library + seed job</text><text x="843" y="166.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">Branch-out copies item definitions,</text><text x="843" y="181.53" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">NOT data. Bind each branch workspace</text><text x="843" y="196.71" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">to its own lakehouse / warehouse /</text><text x="843" y="211.89000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#08454B">connection through an active value set.</text><text x="58" y="274" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Each pair syncs bidirectionally — Commit (workspace → Git) and Update (Git → workspace) — under the developer's own PAT.</text><line x1="170" y1="288" x2="170" y2="312" stroke="#4B3F86" stroke-width="2.2" marker-end="url(#ahp)"/><text x="182" y="305" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#453B74">open PR</text><rect x="28" y="316" width="1124" height="158" rx="9" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="42" y="335" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#2B2450" letter-spacing="0.6">2 · INTEGRATION &amp; QUALITY GATES</text><rect x="58" y="352" width="218" height="104" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="167.0" y="381.105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2B2450">Pull request</text><text x="167.0" y="404.745" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#2B2450">feature/* → main</text><text x="167.0" y="420.15500000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#2B2450">Atomic commits</text><text x="167.0" y="435.565" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#2B2450">Threaded review</text><rect x="300" y="352" width="218" height="104" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="409.0" y="381.105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2B2450">Repository ruleset</text><text x="409.0" y="404.745" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#2B2450">Restrict updates</text><text x="409.0" y="420.15500000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#2B2450">Block force pushes</text><text x="409.0" y="435.565" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#2B2450">≥ 1 approving review</text><rect x="542" y="352" width="218" height="104" rx="7" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="651.0" y="381.105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#323741">Automated checks</text><text x="651.0" y="404.745" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#323741">Secret scanning</text><text x="651.0" y="420.15500000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#323741">CodeQL · file size / path</text><text x="651.0" y="435.565" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#323741">[optional] CI tests</text><rect x="806" y="352" width="318" height="104" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="965.0" y="381.105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#124A20">main branch</text><text x="965.0" y="404.745" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#124A20">Single source of truth.</text><text x="965.0" y="420.15500000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#124A20">Always deployable. No direct</text><text x="965.0" y="435.565" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#124A20">pushes, no force pushes.</text><line x1="276" y1="404" x2="298" y2="404" stroke="#3A3F4B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="518" y1="404" x2="540" y2="404" stroke="#3A3F4B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="760" y1="404" x2="804" y2="404" stroke="#3A3F4B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="28" y="508" width="1124" height="224" rx="9" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="42" y="527" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#6E4200" letter-spacing="0.6">3 · CONTROLLED RELEASE</text><rect x="58" y="548" width="262" height="92" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="189.0" y="578.695" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#12314F">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-DEV</text><text x="189.0" y="601.705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#12314F">Connected to main.</text><text x="189.0" y="617.115" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#12314F">Update from Git after merge.</text><rect x="398" y="548" width="262" height="92" rx="7" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="529.0" y="578.695" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-TST</text><text x="529.0" y="601.705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#6E4200">Deployment pipeline target.</text><text x="529.0" y="617.115" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#6E4200">Deployment rules rebind sources.</text><rect x="738" y="548" width="262" height="92" rx="7" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="869.0" y="578.695" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-PRD</text><text x="869.0" y="601.705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#6E4200">Deployment pipeline target.</text><text x="869.0" y="617.115" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#6E4200">Gated approval required.</text><rect x="1018" y="548" width="106" height="92" rx="7" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="1071.0" y="579.92" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#323741">Audit</text><text x="1071.0" y="602.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#323741">activity log</text><text x="1071.0" y="616.37" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#323741">monitoring hub</text><line x1="320" y1="594" x2="394" y2="594" stroke="#B26B00" stroke-width="2" marker-end="url(#aho)"/><line x1="660" y1="594" x2="734" y2="594" stroke="#B26B00" stroke-width="2" marker-end="url(#aho)"/><text x="357" y="582" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#8A5200">deploy</text><text x="697" y="582" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#8A5200">deploy</text><rect x="58" y="664" width="942" height="46" rx="6" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="529.0" y="689.875" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#323741">Deployment pipelines are configured in the Fabric service — they are not version-controlled by Git integration.</text><path d="M 965,456 L 965,496 L 344,496 L 344,594 L 326,594" fill="none" stroke="#1E7B34" stroke-width="2.2" marker-end="url(#ahg)"/><text x="668" y="488" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#166A2C">update from Git after merge</text><text x="28" y="760" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">No change reaches production except via: branch workspace → feature branch → pull request → main → deployment pipeline.</text></svg>