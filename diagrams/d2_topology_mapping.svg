-width="1.7" marker-end="url(#ahp)"/><path d="M 854,149 L 843,149 L 843,291 L 854,291" fill="none" stroke="#4B3F86" stroke-width="1.7" marker-end="url(#ahp)"/><path d="M 854,149 L 838,149 L 838,357 L 854,357" fill="none" stroke="#B3261E" stroke-width="1.7" marker-end="url(#ahr)"/><rect x="856" y="406" width="272" height="158" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="992.0" y="430.44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7A1A15">One branch, one folder, at a time</text><text x="869" y="451.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">A workspace is connected to exactly</text><text x="869" y="465.82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">one branch and one folder.</text><text x="869" y="486.94" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Switching branch re-syncs the whole</text><text x="869" y="501.46" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">workspace: items that do not exist</text><text x="869" y="515.98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">in the new branch are DELETED.</text><rect x="856" y="580" width="272" height="108" rx="7" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="992.0" y="604.44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#323741">Structural limits</text><text x="869" y="625.3000000000001" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">Folder depth ≤ 10 levels</text><text x="869" y="639.82" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">Full file path ≤ 250 chars</text><text x="869" y="654.34" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">Single file ≤ 25 MB</text><text x="869" y="668.86" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">Branch name ≤ 244 chars</text><rect x="28" y="726" width="1124" height="50" rx="6" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="590.0" y="753.9899999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6E4200">Naming discipline: the Git folder encodes the layer; the branch encodes the unit of work. Never point two workspaces at the same branch + folder pair.</text></svg>