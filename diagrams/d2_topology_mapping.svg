xt-anchor="start" fill="#12314F">&lt;ORG&gt;-FAB-&lt;PROJ&gt;-OPS-DEV</text><text x="65" y="602.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Orchestration &amp; shared</text><text x="65" y="621.11" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#12314F">Notebooks/ Pipelines/</text><text x="65" y="634.97" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#12314F">Lakehouse/ SemanticModels/</text><text x="65" y="648.83" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#12314F">Reports/ VariableLibrary/</text><rect x="452" y="562" width="328" height="108" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="465" y="586.88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#2B2450">/OPS/</text><text x="465" y="608.35" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2B2450">Notebooks/ Pipelines/</text><text x="465" y="622.21" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2B2450">Lakehouse/ SemanticModels/</text><text x="465" y="636.07" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2B2450">Reports/ VariableLibrary/</text><text x="465" y="649.9300000000001" font-family="Liberation Mono, Consolas, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#2B2450">&lt;item&gt;/.platform</text><path d="M 378,616 L 414,616 L 414,616 L 450,616" fill="none" stroke="#1A4D8F" stroke-width="1.8" marker-end="url(#ahb)" marker-start="url(#ahb)"/><rect x="856" y="120" width="272" height="58" rx=