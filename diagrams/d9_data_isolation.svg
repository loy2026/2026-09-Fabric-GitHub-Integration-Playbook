<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="700" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">The data isolation gap, and how to close it</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Branch-out gives every developer their own items. It does not give them their own data. That gap must be engineered, not assumed.</text><rect x="28" y="86" width="556" height="252" rx="9" fill="#FDECEA" stroke="#B3261E" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="42" y="105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#7A1A15" letter-spacing="0.6">THE DEFAULT BEHAVIOUR — NOT ISOLATED</text><rect x="56" y="124" width="232" height="74" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="172.0" y="153.62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#12314F">Branch workspace A</text><text x="172.0" y="176.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">notebook, pipeline</text><rect x="56" y="214" width="232" height="74" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="172.0" y="243.62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#12314F">Branch workspace B</text><text x="172.0" y="266.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">notebook, pipeline</text><rect x="346" y="166" width="212" height="90" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="452.0" y="196.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7A1A15">Shared DEV lakehouse</text><text x="452.0" y="218.63" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#7A1A15">one set of Files</text><text x="452.0" y="233.37" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#7A1A15">and Tables</text><line x1="292" y1="161" x2="342" y2="196" stroke="#B3261E" stroke-width="2" marker-end="url(#ahr)"/><line x1="292" y1="251" x2="342" y2="226" stroke="#B3261E" stroke-width="2" marker-end="url(#ahr)"/><text x="56" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Both developers read and write the same physical data.</text><rect x="596" y="86" width="556" height="252" rx="9" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="610" y="105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#124A20" letter-spacing="0.6">WITH A VARIABLE LIBRARY — ISOLATED</text><rect x="624" y="124" width="232" height="74" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="740.0" y="153.62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#12314F">Branch workspace A</text><text x="740.0" y="176.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">value set: dev_a</text><rect x="624" y="214" width="232" height="74" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="740.0" y="243.62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#12314F">Branch workspace B</text><text x="740.0" y="266.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#12314F">value set: dev_b</text><rect x="914" y="116" width="212" height="84" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="1020.0" y="150.62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#124A20">Lakehouse dev_a</text><text x="1020.0" y="173.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#124A20">own Files/Tables</text><rect x="914" y="212" width="212" height="84" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="1020.0" y="246.62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#124A20">Lakehouse dev_b</text><text x="1020.0" y="269.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#124A20">own Files/Tables</text><line x1="860" y1="161" x2="910" y2="158" stroke="#1E7B34" stroke-width="2" marker-end="url(#ahg)"/><line x1="860" y1="251" x2="910" y2="254" stroke="#1E7B34" stroke-width="2" marker-end="url(#ahg)"/><text x="624" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Each item resolves its source from the active value set.</text><rect x="28" y="356" width="364" height="200" rx="7" fill="#E4F4F5" stroke="#0E6E78" stroke-width="1.8"/><text x="41" y="381.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#08454B">Option 1 — Variable Library (preferred)</text><text x="41" y="403.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">A workspace item holding named variables with a</text><text x="41" y="417.91999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">value set per stage or per developer.</text><text x="41" y="439.03999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">• Item references, connection strings, integers</text><text x="41" y="453.55999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">• Consumed by pipelines, notebooks (NotebookUtils),</text><text x="41" y="468.0799999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">Dataflow Gen2, Copy Job, shortcuts, UDFs</text><text x="41" y="482.5999999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">• Version-controlled and deployable like any item</text><text x="41" y="497.1199999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#08454B">• One active value set per workspace at a time</text><rect x="408" y="356" width="364" height="200" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="421" y="381.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#12314F">Option 2 — Automated seeding</text><text x="421" y="403.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">A job triggered on branch creation that provisions a</text><text x="421" y="417.91999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">lightweight isolated dataset.</text><text x="421" y="439.03999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">• Small, representative, anonymised subset</text><text x="421" y="453.55999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">• Fast enough that developers do not bypass it</text><text x="421" y="468.0799999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">• Tear down with the branch workspace</text><text x="421" y="482.5999999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">• Best combined with Option 1 rather than instead</text><text x="421" y="497.1199999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">of it — seeding needs somewhere to point</text><rect x="788" y="356" width="364" height="200" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="801" y="381.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#7A1A15">What breaks without either</text><text x="801" y="403.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">• A notebook in the branch workspace still points</text><text x="801" y="417.91999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">at the ORIGINAL workspace's lakehouse.</text><text x="801" y="439.03999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">• Tests pass or fail based on someone else's data.</text><text x="801" y="453.55999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">• A developer can corrupt shared DEV data while</text><text x="801" y="468.0799999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">believing they are in a sandbox.</text><text x="801" y="489.19999999999993" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">• The isolation the branch workspace advertises</text><text x="801" y="503.7199999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">is, in practice, code-only.</text><rect x="28" y="580" width="1124" height="100" rx="7" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="590.0" y="606.3299999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#6E4200">Design rule</text><text x="590.0" y="631.2299999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6E4200">No Fabric item should contain a hard-coded workspace name, lakehouse reference, connection string or database name. Every environment-specific</text><text x="590.0" y="647.31" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6E4200">value belongs in a Variable Library and is selected by the active value set. This single rule is what makes branch workspaces, deployment</text><text x="590.0" y="663.3899999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6E4200">pipelines and deployment rules all work as intended — and its absence is the most common cause of a CI/CD implementation that never stabilises.</text></svg>