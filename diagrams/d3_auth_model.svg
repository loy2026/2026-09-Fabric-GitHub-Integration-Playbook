<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="700" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">Two-tier authentication model</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Human identities and automation identities are deliberately separated. Fabric's workspace-to-GitHub connection is user-delegated and cannot use a service principal.</text><rect x="28" y="86" width="556" height="486" rx="9" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="42" y="105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#12314F" letter-spacing="0.6">TIER 1 · HUMAN IDENTITY (INTERACTIVE)</text><rect x="56" y="122" width="500" height="96" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="69" y="147.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#12314F">Developer — Microsoft Entra ID account</text><text x="69" y="169.39999999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">Signs in to Fabric. Holds a workspace role (Admin / Member / Contributor).</text><text x="69" y="184.57999999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">MFA strength in Fabric must be at least that required by GitHub.</text><rect x="56" y="244" width="500" height="140" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="69" y="269.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2B2450">Fine-grained Personal Access Token (PAT)</text><text x="69" y="291.4" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Repository access → only this project's repository</text><text x="69" y="305.91999999999996" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Repository permissions → Contents: Read and write</text><text x="69" y="320.43999999999994" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Metadata: Read (implicit)</text><text x="69" y="334.9599999999999" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Expiry → shortest interval the team can operate with</text><text x="69" y="349.4799999999999" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Scope → one token per person; never shared</text><rect x="56" y="410" width="500" height="138" rx="7" fill="#FFFFFF" stroke="#9AA0AA" stroke-width="1.8"/><text x="69" y="434.88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#323741">What it is used for</text><text x="69" y="456.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">• Connecting a workspace to a repository branch + folder</text><text x="69" y="470.87" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">• Commit (workspace → Git) and Update (Git → workspace)</text><text x="69" y="485.39" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">• Branch out, checkout new branch, switch branch</text><text x="69" y="506.51" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">The Git connection is per user: every person working in a shared</text><text x="69" y="521.03" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">workspace configures their own account — tokens are never pooled.</text><rect x="628" y="86" width="524" height="486" rx="9" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.85"/><text x="642" y="105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#6E4200" letter-spacing="0.6">TIER 2 · WORKLOAD IDENTITY (AUTOMATED)</text><rect x="656" y="122" width="468" height="96" rx="7" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="669" y="147.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#6E4200">Service principal — Entra ID app registration</text><text x="669" y="169.39999999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6E4200">Non-human identity for CI/CD and administrative automation.</text><text x="669" y="184.57999999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6E4200">Decoupled from any employee's account or employment status.</text><rect x="656" y="244" width="468" height="140" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="669" y="269.32" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2B2450">Credentials, stored as GitHub secrets</text><text x="669" y="291.4" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">AZURE_TENANT_ID Directory (tenant) ID</text><text x="669" y="305.91999999999996" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">AZURE_CLIENT_ID Application (client) ID</text><text x="669" y="320.43999999999994" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">AZURE_CLIENT_SECRET client secret (or certificate)</text><text x="669" y="341.55999999999995" font-family="Liberation Mono, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Scope → ENVIRONMENT secrets, never repository secrets</text><rect x="656" y="410" width="468" height="138" rx="7" fill="#FFFFFF" stroke="#9AA0AA" stroke-width="1.8"/><text x="669" y="434.88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#323741">What it is used for</text><text x="669" y="456.35" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">• Fabric REST API calls from GitHub Actions</text><text x="669" y="470.87" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">• Deployment pipeline promotion and post-deploy tasks</text><text x="669" y="485.39" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">• Requires: tenant setting 'service principals can use Fabric APIs'</text><text x="669" y="499.90999999999997" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">+ the SP added to each target workspace as Admin or Member</text><text x="669" y="521.03" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">Not usable for the workspace ↔ GitHub Git connection.</text><rect x="28" y="596" width="1124" height="74" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="590.0" y="617.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#124A20">Why the split matters</text><text x="590.0" y="640.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#124A20">A developer's PAT reaches only the branches that developer may touch. Automation credentials reach only the environment whose job is running.</text><text x="590.0" y="656.86" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#124A20">When a person leaves, revoking their account does not break the pipeline; when a pipeline is compromised, no human's access is implicated.</text></svg>