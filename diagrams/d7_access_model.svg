<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="660" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">Access model: identity, teams, repository roles and gates</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Permissions are granted to teams, never to individuals. Team membership is sourced from the identity provider.</text><rect x="28" y="92" width="236" height="210" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="41" y="118.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#12314F">Microsoft Entra ID</text><text x="41" y="141.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">Security groups are the</text><text x="41" y="156.68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">authoritative record of who</text><text x="41" y="171.86" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">does what.</text><text x="41" y="193.94000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">SCIM provisioning adds and</text><text x="41" y="209.12000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">— more importantly — removes</text><text x="41" y="224.30000000000004" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">access automatically, closing</text><text x="41" y="239.48000000000005" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#12314F">the leaver gap.</text><path d="M 268,197 L 292,197" fill="none" stroke="#3A3F4B" stroke-width="2.2"/><rect x="316" y="92" width="512" height="108" rx="8" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="334" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#7A1A15">fabric-admins</text><rect x="334" y="136" width="163.9" height="24" rx="12.0" fill="#FDECEA" stroke="#B3261E" stroke-width="1.5"/><text x="415.9425" y="152.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7A1A15">repository role: Admin</text><text x="334" y="182" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">Repository settings, rulesets, environments and secrets. Highly</text><text x="334" y="197" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">privileged — a small group of platform owners.</text><path d="M 292,197 L 292,146 L 314,146" fill="none" stroke="#1A4D8F" stroke-width="2" marker-end="url(#ahb)"/><rect x="316" y="216" width="512" height="108" rx="8" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="334" y="246" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#6E4200">fabric-reviewers</text><rect x="334" y="260" width="182.7" height="24" rx="12.0" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.5"/><text x="425.34375" y="276.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#6E4200">repository role: Maintain</text><text x="334" y="306" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">Review, approve and merge to main. Gains merge authority without</text><text x="334" y="321" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">access to sensitive repository settings.</text><path d="M 292,197 L 292,270 L 314,270" fill="none" stroke="#1A4D8F" stroke-width="2" marker-end="url(#ahb)"/><rect x="316" y="340" width="512" height="108" rx="8" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="334" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#12314F">fabric-developers</text><rect x="334" y="384" width="163.9" height="24" rx="12.0" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.5"/><text x="415.9425" y="400.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#12314F">repository role: Write</text><text x="334" y="430" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">Push to feature branches and open pull requests. Cannot merge to</text><text x="334" y="445" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">main and cannot alter protection rules.</text><path d="M 292,197 L 292,394 L 314,394" fill="none" stroke="#1A4D8F" stroke-width="2" marker-end="url(#ahb)"/><rect x="316" y="464" width="512" height="108" rx="8" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="334" y="494" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#323741">fabric-auditors</text><rect x="334" y="508" width="157.6" height="24" rx="12.0" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.5"/><text x="412.80875000000003" y="524.14" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#323741">repository role: Read</text><text x="334" y="554" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">View code, issues and pull requests. No write capability at all —</text><text x="334" y="569" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">compliance, project managers, analysts.</text><path d="M 292,197 L 292,518 L 314,518" fill="none" stroke="#1A4D8F" stroke-width="2" marker-end="url(#ahb)"/><rect x="856" y="92" width="292" height="232" rx="7" fill="#E7F4EA" stroke="#1E7B34" stroke-width="1.8"/><text x="869" y="117.76" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#124A20">Gates these roles enforce</text><text x="869" y="140.45000000000002" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">• Only fabric-reviewers can merge</text><text x="869" y="154.97000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">into main.</text><text x="869" y="176.09000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">• A ruleset requires their approval,</text><text x="869" y="190.61000000000004" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">and approvals are dismissed when</text><text x="869" y="205.13000000000005" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">the diff changes.</text><text x="869" y="226.25000000000006" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">• CODEOWNERS routes each layer</text><text x="869" y="240.77000000000007" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">folder to the team that owns it.</text><text x="869" y="261.8900000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">• Environment reviewers gate the</text><text x="869" y="276.4100000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#124A20">deployment job separately.</text><rect x="856" y="340" width="292" height="232" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="869" y="365.76" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#12314F">The Fabric-side counterpart</text><text x="869" y="388.45" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Repository roles grant no workspace</text><text x="869" y="402.96999999999997" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">access. Grant Fabric workspace roles</text><text x="869" y="417.48999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">to the same Entra groups:</text><text x="869" y="438.60999999999996" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Admin connect / disconnect Git,</text><text x="869" y="453.12999999999994" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">switch branch</text><text x="869" y="467.6499999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Member commit, update, branch out</text><text x="869" y="482.1699999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Contributor commit, update, branch out</text><text x="869" y="496.6899999999999" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Viewer no Git visibility at all</text><text x="869" y="517.8099999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Misalignment here is a common source</text><text x="869" y="532.3299999999998" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">of 'it works for me' failures.</text><rect x="28" y="588" width="1120" height="58" rx="6" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="588.0" y="611.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">Least privilege, stated once: a developer can propose any change and merge none of them; a reviewer can merge but cannot change the rules; an</text><text x="588.0" y="628.61" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#6E4200">administrator can change the rules and is a small, audited group.</text></svg>