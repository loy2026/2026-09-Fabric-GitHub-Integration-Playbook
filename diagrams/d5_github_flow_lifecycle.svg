<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="640" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">GitHub Flow lifecycle for a Fabric change</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Eight steps, three actors, one protected branch. Feature branches are short-lived; main stays deployable at all times.</text><rect x="32" y="104" width="262" height="190" rx="8" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><circle cx="58" cy="130" r="15" fill="#1A4D8F"/><text x="58" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="82" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#12314F">Branch out</text><rect x="46" y="154" width="71.5" height="20" rx="10.0" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.5"/><text x="81.75125" y="167.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#12314F">Developer</text><text x="47" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Source control → Branch out. Fabric</text><text x="47" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">creates the feature branch and a</text><text x="47" y="226" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">branch workspace, then syncs item</text><text x="47" y="241" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">definitions into it. Data is not</text><text x="47" y="256" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">copied.</text><rect x="314" y="104" width="262" height="190" rx="8" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><circle cx="340" cy="130" r="15" fill="#1A4D8F"/><text x="340" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="364" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#12314F">Build and test</text><rect x="328" y="154" width="71.5" height="20" rx="10.0" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.5"/><text x="363.75125" y="167.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#12314F">Developer</text><text x="329" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Develop inside the isolated</text><text x="329" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">workspace. Bind data sources through</text><text x="329" y="226" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">a Variable Library value set so</text><text x="329" y="241" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">nothing shared is touched.</text><rect x="596" y="104" width="262" height="190" rx="8" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><circle cx="622" cy="130" r="15" fill="#1A4D8F"/><text x="622" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="646" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#12314F">Commit</text><rect x="610" y="154" width="71.5" height="20" rx="10.0" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.5"/><text x="645.75125" y="167.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#12314F">Developer</text><text x="611" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">Source control → Changes → select</text><text x="611" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">items → add a message → Commit. Keep</text><text x="611" y="226" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">commits small and atomic — one</text><text x="611" y="241" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#12314F">logical change each.</text><rect x="878" y="104" width="262" height="190" rx="8" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><circle cx="904" cy="130" r="15" fill="#4B3F86"/><text x="904" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="928" y="135.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#2B2450">Change is in Git</text><rect x="892" y="154" width="54.3" height="20" rx="10.0" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.5"/><text x="919.1675" y="167.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#2B2450">GitHub</text><text x="893" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">The feature branch now holds the</text><text x="893" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">change as human-readable text.</text><text x="893" y="226" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">Reviewers can diff notebooks,</text><text x="893" y="241" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">semantic models and pipeline</text><text x="893" y="256" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">definitions.</text><rect x="32" y="358" width="262" height="190" rx="8" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><circle cx="58" cy="384" r="15" fill="#4B3F86"/><text x="58" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><text x="82" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#2B2450">Open pull request</text><rect x="46" y="408" width="54.3" height="20" rx="10.0" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.5"/><text x="73.1675" y="421.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#2B2450">GitHub</text><text x="47" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">feature/* → main. State the intent,</text><text x="47" y="465" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">the blast radius and how it was</text><text x="47" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">tested. The PR becomes the record of</text><text x="47" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2B2450">why the change was accepted.</text><rect x="314" y="358" width="262" height="190" rx="8" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><circle cx="340" cy="384" r="15" fill="#B26B00"/><text x="340" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6</text><text x="364" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#6E4200">Review and checks</text><rect x="328" y="408" width="65.8" height="20" rx="10.0" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.5"/><text x="360.89" y="421.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6E4200">Reviewer</text><text x="329" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">The ruleset blocks merge until</text><text x="329" y="465" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">required approvals are in and every</text><text x="329" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">required status check passes. New</text><text x="329" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">commits dismiss stale approvals.</text><rect x="596" y="358" width="262" height="190" rx="8" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><circle cx="622" cy="384" r="15" fill="#B26B00"/><text x="622" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">7</text><text x="646" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#6E4200">Merge to main</text><rect x="610" y="408" width="65.8" height="20" rx="10.0" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.5"/><text x="642.89" y="421.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6E4200">Reviewer</text><text x="611" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">Merge through the pull request only,</text><text x="611" y="465" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">then delete the feature branch. main</text><text x="611" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">holds the change and remains the</text><text x="611" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">single source of truth.</text><rect x="878" y="358" width="262" height="190" rx="8" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><circle cx="904" cy="384" r="15" fill="#B26B00"/><text x="904" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">8</text><text x="928" y="389.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#6E4200">Update and promote</text><rect x="892" y="408" width="60.1" height="20" rx="10.0" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.5"/><text x="922.02875" y="421.78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#6E4200">Release</text><text x="893" y="450" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">In the DEV workspace: Source control</text><text x="893" y="465" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">→ Updates → Update all. Then promote</text><text x="893" y="480" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">to TST and PRD with the deployment</text><text x="893" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">pipeline.</text><line x1="294" y1="199.0" x2="312" y2="199.0" stroke="#3A3F4B" stroke-width="2" marker-end="url(#ahb)"/><line x1="294" y1="453.0" x2="312" y2="453.0" stroke="#B26B00" stroke-width="2" marker-end="url(#aho)"/><line x1="576" y1="199.0" x2="594" y2="199.0" stroke="#3A3F4B" stroke-width="2" marker-end="url(#ahb)"/><line x1="576" y1="453.0" x2="594" y2="453.0" stroke="#B26B00" stroke-width="2" marker-end="url(#aho)"/><line x1="858" y1="199.0" x2="876" y2="199.0" stroke="#3A3F4B" stroke-width="2" marker-end="url(#ahb)"/><line x1="858" y1="453.0" x2="876" y2="453.0" stroke="#B26B00" stroke-width="2" marker-end="url(#aho)"/><path d="M 1009.0,294 L 1009.0,328 L 163.0,328 L 163.0,356" fill="none" stroke="#4B3F86" stroke-width="2" marker-end="url(#ahp)"/><text x="600" y="322" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#453B74">open a pull request</text><rect x="32" y="566" width="552" height="62" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="45" y="590.44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7A1A15">If the review is rejected</text><text x="45" y="611.3000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">Push corrections to the same feature branch and request re-review. Changes that alter</text><text x="45" y="625.82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#7A1A15">the diff dismiss existing approvals, so nothing merges on a stale sign-off.</text><rect x="600" y="566" width="548" height="62" rx="7" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="613" y="590.44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#323741">When the release ships</text><text x="613" y="611.3000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">Delete the branch workspaces and any preflight clones. They are temporary by design;</text><text x="613" y="625.82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#323741">leaving them running costs capacity and lets copies drift from the protected branch.</text></svg>