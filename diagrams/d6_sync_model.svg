<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A3F4B"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1A4D8F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B3261E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1E7B34"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B26B00"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4B3F86"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E78"/></marker></defs><rect width="1180" height="600" fill="#FFFFFF"/><text x="28" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#12263F">The synchronization model: Commit, Update and the states in between</text><text x="28" y="62" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#5C6270" font-style="italic">Synchronization is bidirectional but never simultaneous. Commit lets you select items; Update always takes the whole branch.</text><rect x="80" y="100" width="360" height="132" rx="7" fill="#E8F0FE" stroke="#1A4D8F" stroke-width="1.8"/><text x="260.0" y="142.33" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#12314F">FABRIC WORKSPACE</text><text x="260.0" y="167.23000000000002" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#12314F">Live items. Saving an edit changes the</text><text x="260.0" y="183.31000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#12314F">workspace only — nothing reaches Git</text><text x="260.0" y="199.39000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#12314F">until you commit.</text><rect x="740" y="100" width="360" height="132" rx="7" fill="#EFEEF6" stroke="#4B3F86" stroke-width="1.8"/><text x="920.0" y="142.33" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B2450">GIT BRANCH + FOLDER</text><text x="920.0" y="167.23000000000002" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#2B2450">Item definitions as text files.</text><text x="920.0" y="183.31000000000003" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#2B2450">Restorable to any earlier commit —</text><text x="920.0" y="199.39000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#2B2450">a workspace is not.</text><line x1="452" y1="140" x2="726" y2="140" stroke="#1A4D8F" stroke-width="2" marker-end="url(#ahb)"/><text x="590" y="130" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A4D8F">COMMIT</text><text x="590" y="158" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#3C5B80">workspace → Git · you choose the items</text><line x1="726" y1="198" x2="452" y2="198" stroke="#1E7B34" stroke-width="2" marker-end="url(#ahg)"/><text x="590" y="188" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#166A2C">UPDATE</text><text x="590" y="216" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#2C6B40">Git → workspace · every item, always</text><rect x="80" y="262" width="500" height="190" rx="8" fill="#FFFFFF" stroke="#9AA0AA" stroke-width="1.8"/><text x="96" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#323741">Source control pane — three tabs</text><text x="96" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Commits and updates</text><text x="266" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">changes to push | updates to pull</text><text x="96" y="334" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Branches</text><text x="266" y="334" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">branch out · checkout new branch ·</text><text x="96" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741"></text><text x="266" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">switch branch · related branches</text><text x="96" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Account details</text><text x="266" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">provider, account, repo, branch</text><text x="96" y="394" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#5C6270">The badge on the source control icon counts the items that differ. A badge</text><text x="96" y="408.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#5C6270">of 0 means the workspace and the branch agree.</text><rect x="600" y="262" width="500" height="190" rx="8" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.8"/><text x="616" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" text-anchor="start" fill="#323741">Item Git status values</text><text x="616" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Synced</text><text x="786" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">identical in both places</text><text x="616" y="334" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Uncommitted changes</text><text x="786" y="334" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">changed in the workspace</text><text x="616" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Update required</text><text x="786" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">changed in the branch</text><text x="616" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Conflict</text><text x="786" y="370" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">changed in BOTH — must be resolved</text><text x="616" y="388" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Unsupported</text><text x="786" y="388" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">ignored by the integration</text><text x="616" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#323741">Same change</text><text x="786" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#323741">identical, needs the latest commit</text><rect x="80" y="474" width="1020" height="50" rx="6" fill="#FDECEA" stroke="#B3261E" stroke-width="1.8"/><text x="590.0" y="502.105" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#7A1A15">Hard rule: while updates are pending, commits are blocked. Update first, resolve any conflict, then commit.</text><rect x="80" y="536" width="1020" height="52" rx="7" fill="#FFF4E5" stroke="#B26B00" stroke-width="1.8"/><text x="91" y="558.44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#6E4200">Diffs that are not real changes</text><text x="91" y="579.3000000000001" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#6E4200">Column reordering in a semantic model .bim after a rename · CRLF converted to LF on commit from the service · a diff after an Enhanced Refresh API call.</text></svg>